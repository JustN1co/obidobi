<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Strefa Prywatna</title>
        <link rel="icon" type="image/png" href="/lock.png">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

        <style>
            /* OGÓLNE USTAWIENIA */
            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
                background-color: #0a0a0a;
            }

            .staticrypt-content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Poppins', sans-serif;
                /* Tło z głębokim gradientem */
                background: radial-gradient(circle at center, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%), url('rosesbg.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
            }

            /* KARTA FORMULARZA */
            .staticrypt-page {
                width: 100%;
                max-width: 420px;
                padding: 20px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                padding: 50px 40px;
                border-radius: 30px;
                text-align: center;
                /* Subtelna czerwona poświata */
                box-shadow: 0 0 40px rgba(139, 0, 0, 0.3);
                border: 1px solid rgba(139, 0, 0, 0.4);
                color: #ffffff;
            }

            .staticrypt-title {
                font-family: 'Playfair Display', serif;
                font-size: 2.2em;
                font-style: italic;
                margin-bottom: 10px;
                display: block;
                color: #e6b8af; /* Przygaszony róż/złoto */
                text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            }

            .staticrypt-instructions {
                font-size: 15px;
                color: #a0a0a0;
                margin-bottom: 30px;
                letter-spacing: 0.5px;
            }

            /* STYLE DLA INPUTÓW */
            .staticrypt-password-container {
                position: relative;
                margin-bottom: 25px;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 12px;
                border: 1px solid rgba(139, 0, 0, 0.3);
                transition: 0.4s;
            }

            .staticrypt-password-container:focus-within {
                border-color: #8b0000;
                background: rgba(139, 0, 0, 0.1);
                box-shadow: 0 0 10px rgba(139, 0, 0, 0.2);
            }

            .staticrypt-form input[type="password"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 16px;
                outline: 0;
                padding: 18px;
                width: 100%;
                color: #ffffff;
                text-align: center;
                letter-spacing: 4px;
            }

            /* PRZYCISK Z PULSACJĄ */
            .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 2px;
                font-weight: 600;
                outline: 0;
                background: linear-gradient(45deg, #4b0000, #8b0000);
                width: 100%;
                border: 1px solid rgba(255,255,255,0.1);
                padding: 16px;
                color: #ffffff;
                font-size: 13px;
                cursor: pointer;
                border-radius: 50px;
                transition: 0.4s ease;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            }

            .staticrypt-decrypt-button:hover {
                transform: scale(1.02);
                background: linear-gradient(45deg, #600000, #a80000);
                box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
            }

            /* CHECKBOX */
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 25px;
                font-size: 13px;
                color: #888;
                cursor: pointer;
                font-style: italic;
            }

            .staticrypt-remember input[type="checkbox"] {
                margin-right: 10px;
                accent-color: #8b0000;
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid rgba(139, 0, 0, 0.2);
                margin: 30px 0;
            }

            /* Spinner dopasowany do klimatu */
            .staticrypt-spinner {
                border: 3px solid rgba(139, 0, 0, 0.1);
                border-right-color: #8b0000;
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">
                    <div class="staticrypt-instructions">
                        <span class="staticrypt-title">Tylko dla Twoich oczu</span>
                        <p>Podaj hasło, aby odkryć tajemnicę...</p>
                    </div>

                    <hr class="staticrypt-hr" />

                    <form id="staticrypt-form" action="#" method="post">
                        <div class="staticrypt-password-container">
                            <input

                        </div>

                            <input id="staticrypt-remember" type="checkbox" name="remember" />
                            Zostań ze mną na dłużej
                        </label>

                        <input type="submit" class="staticrypt-decrypt-button" value="Odkryj" />
                    </form>
                </div>
            </div>
        </div>
