<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
}

/* powrót */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
}

.back a {
    color: white;
    text-decoration: none;
    background: #222;
    padding: 8px 14px;
    border-radius: 20px;
}

/* poziom */
.level {
    position: absolute;
    top: 20px;
    right: 20px;
}

.level button {
    background: #222;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
}

/* kontener */
.container {
    text-align: center;
}

/* przyciski */
.buttons {
    margin-bottom: 40px;
}

.btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 20px;
    margin: 10px;
    cursor: pointer;
    background: #222;
    color: white;
    transition: 0.3s;
}

/* wynik */
.result {
    font-size: 22px;
    max-width: 500px;
}
</style>
</head>

</div>

<div class="level">
    <button id="poziomBtn" onclick="togglePoziom()">poziom wyżej</button>

function losuj(kto) {
    let lista;

    if (poziom === 1) {
        lista = kto === 'N' ? wyzwaniaN_lvl1 : wyzwaniaO_lvl1;
    } else {
        lista = kto === 'N' ? wyzwaniaN_lvl2 : wyzwaniaO_lvl2;
    }

    if (lista.length === 0) {
        document.getElementById("result").innerText = "Brak wyzwań 💀";
        return;
    }

    const random = Math.floor(Math.random() * lista.length);
    document.getElementById("result").innerText = lista[random];
}

function togglePoziom() {
    poziom = poziom === 1 ? 2 : 1;

    const btn = document.getElementById("poziomBtn");

    if (poziom === 2) {
        btn.innerText = "poziom niżej";
        document.body.style.background = "#1a0000";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#5a0000";
        });

    } else {
        btn.innerText = "poziom wyżej";
        document.body.style.background = "#111";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#222";
        });
    }
}
