<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Spicy</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
}

/* powrót */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
}

.back a {
    color: white;
    text-decoration: none;
    background: #222;
    padding: 8px 14px;
    border-radius: 20px;
}

/* poziom */
.level {
    position: absolute;
    top: 20px;
    right: 20px;
}

.level button {
    background: #222;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
}

/* kontener */
.container {
    text-align: center;
}

/* przyciski */
.buttons {
    margin-bottom: 40px;
}

.btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 20px;
    margin: 10px;
    cursor: pointer;
    background: #222;
    color: white;
    transition: 0.3s;
}

/* wynik */
.result {
    font-size: 22px;
    max-width: 500px;
}
</style>
</head>

<body>

<div class="back">
    <a href="/">← powrót</a>
</div>

<div class="level">
    <button id="poziomBtn" onclick="togglePoziom()">poziom wyżej</button>
</div>

<div class="container">
    <div class="buttons">
        <button class="btn" onclick="losuj('N')">N</button>
        <button class="btn" onclick="losuj('O')">O</button>
    </div>

    <div class="result" id="result">
        Kliknij literę, żeby wylosować wyzwanie
    </div>
</div>

<script>

let poziom = 1;

// POZIOM 1
const wyzwaniaN_lvl1 = [
"Całuj powoli partnerkę podduszając ją w międzyczasie",
"Przejedź językiem od szyji do ust partnerki, po czym ją pocałuj",
"Wyliż szyję partnerki",
"Rozbierz partnerkę do bielizny powoli patrząc jej w oczy",
"Wyliż krocze partnerki przez bieliznę",
"Zrób partnerce masaż miejsc intymnych przez minutę używając tylko rąk",
"Użyj ust do ściągnięcia majtek partnerki",
"Zrób 3 malinki na ciele partnerki",
"Poliż wewnetrzną część ud partnerki",
"Zasłoń oczy partnerce, po czym wykonaj wybrany przez siebie ruch",
"Wymasuj partnerce pośladki używając do tego balsamu/olejku do ciała",
"Wycałuj ciało partnerki od karku do pośladków, gdy ta leży na brzuchu",
"Ściągnij stanik partnerce podczas całowania",
"Dotykaj partnerkę w każdym miejscu, poza tym, którego naprawdę pragnie",
"Zdominuj partnerkę przez minutę",
"Pocałuj partnerkę w 3 różne sposoby",
"Rozbierz się do bielizny na 2 rundy",
"Ukaraj partnerkę klapsem",
"Wyliż sutki partnerce mając przy tym zamknięte oczy przez całe wyzwanie",
"Wyliż bitą śmietanę z ciała partnerki"
];

const wyzwaniaO_lvl1 = [
"Przeciągnij się jak kotek i pokaż swoje ciało jak na wystawie",
"Zrób 3 malinki na ciele partnera",
"Usiądź tyłem na kolanach partnera oraz wykonaj taniec erotyczny ocierając się tyłkiem",
"Wykonaj masaż erotyczny partnerowi używając do tego tylko rąk",
"Usiądź na partnetrze oraz ocieraj się o niego przez minutę",
"Wyliż dłoń partnera tak, jakby było to coś więcej",
"Zatwerkuj na kroczu partnera w samej bieliźnie",
"Wyliż szyję partnera",
"Wykonaj taniec erotyczny w samej bieliźnie nie dotykając partnera oraz vice versa",
"Kuś partnera przez 30 sekund, partner nie może cię dotykać w międzyczasie",
"Rozbierz się do bielizny na 2 rundy",
"Napluj partnerowi do buzi podczas całowania",
"Wyliż bitą śmietanę z ciała partnera",
"Wymasuj krocze partnera przez bieliznę stopami",
"Wypnij się jak najbardziej oraz zatwerkuj na oczach partnera w samej bieliźnie",
"Rzuć się na partnera podduszając go w międzyczasie oraz zacznij go namiętnie całować",
"Rościągaj się jakbyś robiła yogę, ale w samej bieliźnie",
"Zdominuj partnera na 30 sekund siedząc lub leżąc na nim",
"Pocałuj partnera w 3 różne sposoby",
"Pozwól się posmarować olejkem do ciała lub balsamem przez partnera"
];

// POZIOM 2
const wyzwaniaN_lvl2 = [
"Wyzwanie poziom 2 - 1",
"Wyzwanie poziom 2 - 2"
];

const wyzwaniaO_lvl2 = [
"Wyzwanie poziom 2 - 1",
"Wyzwanie poziom 2 - 2"
];

function losuj(kto) {
    let lista;

    if (poziom === 1) {
        lista = kto === 'N' ? wyzwaniaN_lvl1 : wyzwaniaO_lvl1;
    } else {
        lista = kto === 'N' ? wyzwaniaN_lvl2 : wyzwaniaO_lvl2;
    }

    if (lista.length === 0) {
        document.getElementById("result").innerText = "Brak wyzwań 💀";
        return;
    }

    const random = Math.floor(Math.random() * lista.length);
    document.getElementById("result").innerText = lista[random];
}

function togglePoziom() {
    poziom = poziom === 1 ? 2 : 1;

    const btn = document.getElementById("poziomBtn");

    if (poziom === 2) {
        btn.innerText = "poziom niżej";
        document.body.style.background = "#1a0000";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#5a0000";
        });

    } else {
        btn.innerText = "poziom wyżej";
        document.body.style.background = "#111";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#222";
        });
    }
}

</script>

</body>
</html>
