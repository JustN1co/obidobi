    <!DOCTYPE html>

        <style>

            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
                background-color: #0a0a0a;
            }

            .staticrypt-content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Poppins', sans-serif;
                /* Tło z głębokim gradientem */
                background: radial-gradient(circle at center, rgba(80, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.9) 100%), url('rosesbg.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
            }

            /* KARTA FORMULARZA */
            .staticrypt-page {
                width: 100%;
                max-width: 420px;
                padding: 20px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: rgba(15, 15, 15, 0.85);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                padding: 50px 40px;
                border-radius: 30px;
                text-align: center;
                /* Subtelna czerwona poświata */
                box-shadow: 0 0 40px rgba(139, 0, 0, 0.3);
                border: 1px solid rgba(139, 0, 0, 0.4);
                color: #ffffff;
            }

            .staticrypt-title {
                font-family: 'Playfair Display', serif;
                font-size: 2.2em;
                font-style: italic;
                margin-bottom: 10px;
                display: block;
                color: #e6b8af; /* Przygaszony róż/złoto */
                text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            }

            .staticrypt-instructions {
                font-size: 15px;
                color: #a0a0a0;
                margin-bottom: 30px;
                letter-spacing: 0.5px;
            }

            /* STYLE DLA INPUTÓW */
            .staticrypt-password-container {
                position: relative;
                margin-bottom: 25px;
                background: rgba(255, 255, 255, 0.03);
                border-radius: 12px;
                border: 1px solid rgba(139, 0, 0, 0.3);
                transition: 0.4s;
            }

            .staticrypt-password-container:focus-within {
                border-color: #8b0000;
                background: rgba(139, 0, 0, 0.1);
                box-shadow: 0 0 10px rgba(139, 0, 0, 0.2);
            }

            .staticrypt-form input[type="password"] {
                background: rgba(0,0,0,0); /* albo rgba(15,15,15,0.0) */
                border: 0;
                box-sizing: border-box;
                font-size: 16px;
                outline: none;
                padding: 18px;
                width: 100%;
                color: #ffffff;
                text-align: center;
                letter-spacing: 4px;
            }

            /* PRZYCISK Z PULSACJĄ */
            .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 2px;
                font-weight: 600;
                outline: 0;
                background: linear-gradient(45deg, #4b0000, #8b0000);
                width: 100%;
                border: 1px solid rgba(255,255,255,0.1);
                padding: 16px;
                color: #ffffff;
                font-size: 13px;
                cursor: pointer;
                border-radius: 50px;
                transition: 0.4s ease;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            }

            .staticrypt-decrypt-button:hover {
                transform: scale(1.02);
                background: linear-gradient(45deg, #600000, #a80000);
                box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 25px;
                font-size: 13px;
                color: #888;
                cursor: pointer;
                font-style: italic;
            }

            .staticrypt-remember input[type="checkbox"] {
                margin-right: 10px;
                accent-color: #8b0000;
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid rgba(139, 0, 0, 0.2);
                margin: 30px 0;
            }

            /* Spinner dopasowany do klimatu */
            .staticrypt-spinner {
                border: 3px solid rgba(139, 0, 0, 0.1);
                border-right-color: #8b0000;
            }
