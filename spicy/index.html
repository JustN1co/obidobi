<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Spicy</title>
<link rel="icon" type="image/png" href="/miniaturka.png">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    transition: 0.3s;
}

/* LOGIN */
#loginScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.login-box {
    background: #1c1c1c;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

.login-box input {
    display: block;
    margin: 10px auto;
    padding: 10px;
    width: 220px;
    background: #222;
    border: none;
    color: white;
    border-radius: 6px;
}

.login-box button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: #444;
    color: white;
    cursor: pointer;
}

#error {
    color: red;
    display: none;
    font-size: 12px;
}

/* powrót */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
}

.back a {
    color: white;
    text-decoration: none;
    background: #222;
    padding: 8px 14px;
    border-radius: 20px;
}

/* poziom */
.level {
    position: absolute;
    top: 20px;
    right: 20px;
}

.level button {
    background: #222;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
}

/* kontener */
.container {
    text-align: center;
}

/* przyciski */
.buttons {
    margin-bottom: 40px;
}

.btn {
    width: 120px;
    height: 120px;
    font-size: 40px;
    border: none;
    border-radius: 20px;
    margin: 10px;
    cursor: pointer;
    background: #222;
    color: white;
    transition: 0.3s;
}

/* wynik */
.result {
    font-size: 22px;
    max-width: 500px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>🔒 Dostęp prywatny</h2>
        <input type="text" id="login" placeholder="Login">
        <input type="password" id="password" placeholder="Hasło">
        <button onclick="checkLogin()">Wejdź</button>
        <p id="error">Zły login lub hasło</p>
    </div>
</div>

<!-- RESZTA STRONY -->
<div id="content" style="display:none; width:100%; height:100%;">

<div class="back">
    <a href="/">← powrót</a>
</div>

<div class="level">
    <button id="poziomBtn" onclick="togglePoziom()">poziom wyżej</button>
</div>

<div class="container">
    <div class="buttons">
        <button class="btn" onclick="losuj('N')">N</button>
        <button class="btn" onclick="losuj('O')">O</button>
    </div>

    <div class="result" id="result">
        Kliknij literę, żeby wylosować wyzwanie
    </div>
</div>

</div>

<script>

// LOGIN
function checkLogin() {
    const login = document.getElementById("login").value;
    const password = document.getElementById("password").value;

    if (login === "Obidobi" && password === "Obidobi123") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("content").style.display = "block";
    } else {
        document.getElementById("error").style.display = "block";
    }
}

let poziom = 1;

// (twoje wyzwania zostają bez zmian)
const wyzwaniaN_lvl1 = [...]; // skrócone tutaj, u ciebie zostają jak były
const wyzwaniaO_lvl1 = [...];
const wyzwaniaN_lvl2 = [...];
const wyzwaniaO_lvl2 = [...];

function losuj(kto) {
    let lista;

    if (poziom === 1) {
        lista = kto === 'N' ? wyzwaniaN_lvl1 : wyzwaniaO_lvl1;
    } else {
        lista = kto === 'N' ? wyzwaniaN_lvl2 : wyzwaniaO_lvl2;
    }

    if (lista.length === 0) {
        document.getElementById("result").innerText = "Brak wyzwań 💀";
        return;
    }

    const random = Math.floor(Math.random() * lista.length);
    document.getElementById("result").innerText = lista[random];
}

function togglePoziom() {
    poziom = poziom === 1 ? 2 : 1;

    const btn = document.getElementById("poziomBtn");

    if (poziom === 2) {
        btn.innerText = "poziom niżej";
        document.body.style.background = "#1a0000";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#5a0000";
        });

    } else {
        btn.innerText = "poziom wyżej";
        document.body.style.background = "#111";

        document.querySelectorAll(".btn").forEach(b => {
            b.style.background = "#222";
        });
    }
}

</script>

</body>
</html>
