<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Nasze TikToki 💞</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    font-family: Arial, Helvetica, sans-serif;
}

.feed {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.video-container {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* phone frame */
.phone {
    position: relative;
    height: 100%;
    aspect-ratio: 9 / 16;
    background: black;
}

/* video */
video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* UI */
.back {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
}

.back a {
    color: white;
    text-decoration: none;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 14px;
}

/* description */
.desc {
    position: absolute;
    bottom: 30px;
    left: 15px;
    color: white;
    max-width: 70%;
    font-size: 15px;
}

/* like section */
.like {
    position: absolute;
    bottom: 100px;
    right: 15px;
    color: white;
    text-align: center;
    cursor: pointer;
    user-select: none;
}

.like span {
    font-size: 32px;
}

.like small {
    display: block;
    font-size: 14px;
}
</style>
</head>

<body>

<script>
// autoplay only visible video
const videos = document.querySelectorAll("video");
const observer = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting ? e.target.play() : e.target.pause());
}, { threshold: 0.6 });
videos.forEach(v => observer.observe(v));

// likes
document.querySelectorAll(".video-container").forEach(container => {
    const id = container.dataset.id;
    const like = container.querySelector(".like");
    const count = like.querySelector("small");

    let likes = localStorage.getItem("likes_" + id) || 0;
    count.textContent = likes;

    like.addEventListener("click", () => {
        likes++;
        localStorage.setItem("likes_" + id, likes);
        count.textContent = likes;
    });
});
</script>
