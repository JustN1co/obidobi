<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/miniaturka.png">
    <title>TikTok Obidobi</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        #backButton {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 15px;
            background-color: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        /* WIDEO KONTENER */
        .video-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* WYGLĄD OPISÓW */
        .description {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 40px 20px 25px 20px;
            box-sizing: border-box;
            text-align: left;
            font-size: 16px;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        #videosWrapper {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none; /* Firefox */
        }
        
        #videosWrapper::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
    </style>
</head>
<body>

<div id="content" style="width:100%; height:100%;">

<button id="backButton" onclick="window.location.href='https://obidobi.pl'">Wróć</button>

<div id="videosWrapper">
    <div class="video-container">
        <video src="1.mp4" autoplay muted loop playsinline></video>
        <div class="description">Every diva beats her bf 🤷‍♀️</div>
    </div>
    <div class="video-container">
        <video src="2.mp4" autoplay muted loop playsinline></video>
        <div class="description">Wziął mnie tylko na SPACER, a wróciłam wyczerpana...</div>
    </div>
    <div class="video-container">
        <video src="3.mp4" autoplay muted loop playsinline></video>
        <div class="description">😠😛</div>
    </div>
    <div class="video-container">
        <video src="4.mp4" autoplay muted loop playsinline></video>
        <div class="description">Jestem dla niej jak benzoo</div>
    </div>
    <div class="video-container">
        <video src="5.mp4" autoplay muted loop playsinline></video>
        <div class="description">freaky ahh</div>
    </div>
    <div class="video-container">
        <video src="6.mp4" autoplay muted loop playsinline></video>
        <div class="description">What do y'all think? #SLAAAAY</div>
    </div>
    <div class="video-container">
        <video src="7.mp4" autoplay muted loop playsinline></video>
        <div class="description">masz BANAAAA</div>
    </div>
    <div class="video-container">
        <video src="8.mp4" autoplay muted loop playsinline></video>
        <div class="description">mm mm :c</div>
    </div>
    <div class="video-container">
        <video src="9.mp4" autoplay muted loop playsinline></video>
        <div class="description">kocham mojego chlopaka, alkohol i palenie</div>
    </div>
    <div class="video-container">
        <video src="10.mp4" autoplay muted loop playsinline></video>
        <div class="description">A wy co lamusy? Pewnie siedzicie na piździe w domu 😂</div>
    </div>
</div>

</div>

<script>
// LOGIKA WIDEO
const videos = document.querySelectorAll('video');

// Pauzowanie kliknięciem na ekranie
videos.forEach(video => {
    video.addEventListener('click', () => {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    });
});

// Autoplay przy scrollowaniu
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if(entry.isIntersecting) {
            entry.target.muted = false; 
            
            let playPromise = entry.target.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay wymaga interakcji użytkownika.");
                });
            }
        } else {
            entry.target.muted = true;
            entry.target.pause();
        }
    });
}, { threshold: 0.6 });

videos.forEach(video => observer.observe(video));

</script>

</body>
</html>
