<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        #backButton {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 10px 15px;
            background-color: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
            border-radius: 5px;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
        }

        video {
            max-height: 90vh;
            width: auto;
            background-color: #000;
        }

        .description {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 18px;
            padding: 5px 10px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 5px;
        }

        #videosWrapper {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
    </style>
</head>
<body>

    <button id="backButton" onclick="window.location.href='https://obidobi.pl'">Wróć</button>

    <div id="videosWrapper">
        <div class="video-container">
            <video src="1.mp4" autoplay muted loop playsinline></video>
            <div class="description">OPIS 1</div>
        </div>
        <div class="video-container">
            <video src="2.mp4" autoplay muted loop playsinline></video>
            <div class="description">OPIS 2</div>
        </div>
        <div class="video-container">

        </div>
        <div class="video-container">

        <div class="video-container">

        <div class="video-container">

</body>
