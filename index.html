<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Strona Chroniona</title>
        <link rel="icon" type="image/png" href="/lock.png">
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            /* OGÓLNE USTAWIENIA TŁA */
            .staticrypt-html, .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                /* TWOJE ZDJĘCIE TŁA */
                background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('zdjecietla.jpg');
                background-size: cover;
                background-position: center;
                background-attachment: fixed;
            }

            /* KARTA FORMULARZA (SZKLISTY EFEKT) */
            .staticrypt-page {
                width: 100%;
                max-width: 400px;
                padding: 20px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: rgba(25, 25, 25, 0.8); /* Ciemne, półprzezroczyste tło */
                backdrop-filter: blur(12px); /* Rozmycie tła za formularzem */
                -webkit-backdrop-filter: blur(12px);
                padding: 40px;
                border-radius: 20px;
                text-align: center;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
                color: #ffffff;
            }

            .staticrypt-title {
                font-size: 1.8em;
                font-weight: 600;
                margin-bottom: 20px;
                display: block;
            }

            .staticrypt-instructions {
                font-size: 14px;
                color: #bbb;
                margin-bottom: 25px;
                line-height: 1.5;
            }

            /* STYLE DLA INPUTÓW */
            .staticrypt-password-container {
                position: relative;
                margin-bottom: 20px;
                background: rgba(255, 255, 255, 0.05);
                border-radius: 10px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                transition: 0.3s;
            }

            .staticrypt-password-container:focus-within {
                border-color: #ffffff;
                background: rgba(255, 255, 255, 0.1);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 16px;
                outline: 0;
                padding: 15px;
                width: 100%;
                color: #ffffff;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 0.5;
                padding: 12px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
                filter: invert(1); /* Zmienia kolor ikonki na biały */
            }

            /* PRZYCISK */
            .staticrypt-decrypt-button {
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: bold;
                outline: 0;
                background: #ffffff;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #000000;
                font-size: 14px;
                cursor: pointer;
                border-radius: 10px;
                transition: 0.3s;
            }

            .staticrypt-decrypt-button:hover {
                background: #e0e0e0;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
            }

            .staticrypt-decrypt-button:active {
                transform: translateY(0);
            }

            /* CHECKBOX "ZAPAMIĘTAJ MNIE" */
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 20px;
                font-size: 13px;
                color: #999;
                cursor: pointer;
            }

            .staticrypt-remember input[type="checkbox"] {
                margin-right: 10px;
                accent-color: #ffffff; /* Kolor zaznaczenia */
            }

            /* SPINNER I UKRYWANIE */
            .hidden { display: none !important; }

            .staticrypt-spinner {
                width: 2.5rem;
                height: 2.5rem;
                border: 3px solid rgba(255,255,255,0.2);
                border-right-color: #ffffff;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            .staticrypt-hr {
                border: 0;
                border-top: 1px solid rgba(255,255,255,0.1);
                margin: 25px 0;
            }
        </style>
    </head>

    <body class="staticrypt-body">
        <div id="staticrypt_loading" class="staticrypt-spinner-container">
            <div class="staticrypt-spinner"></div>
        </div>

        <div id="staticrypt_content" class="staticrypt-content hidden">
            <div class="staticrypt-page">
                <div class="staticrypt-form">

                        <input type="submit" class="staticrypt-decrypt-button" value="DECRYPT" />
                    </form>
                </div>
            </div>
