<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUMO - Math Puzzle</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --neon-pink: #ff00ff;
            --dark-pink: #4d004d;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Przycisk powrotu */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--neon-pink);
            border: 1px solid var(--neon-pink);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn:hover {
            background: var(--neon-pink);
            color: black;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        /* Kontener gry */
        #game-container {
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: var(--neon-pink);
            font-size: 3rem;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 5px;
        }

        .target-box {
            border: 2px solid var(--neon-pink);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: inset 0 0 10px var(--dark-pink);
        }

        .target-label { font-size: 14px; text-transform: uppercase; color: #888; }
        .target-value { font-size: 48px; font-weight: bold; color: var(--neon-pink); }

        /* Liczby i przyciski */
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            min-height: 120px;
        }

        .num-btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .num-btn.selected {
            background: var(--neon-pink);
            color: black;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .operators {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .op-btn {
            background: var(--dark-pink);
            border: none;
            color: var(--neon-pink);
            width: 50px;
            height: 50px;
            font-size: 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .op-btn.selected {
            background: var(--neon-pink);
            color: black;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .action-btn {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .action-btn:hover { background: #333; }

        /* Komunikat o wygranej */
        #win-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            border: 3px solid var(--neon-pink);
            padding: 40px;
            text-align: center;
            display: none;
            z-index: 100;
            box-shadow: 0 0 50px var(--dark-pink);
        }
    </style>
</head>
<body>

    <a href="https://obidobi.pl/games" class="back-btn">← Powrót</a>

    <div id="game-container">
        <h1>SUMO</h1>
        
        <div class="target-box">
            <div class="target-label">CEL:</div>
            <div id="target-number" class="target-value">--</div>
        </div>

        <div id="numbers-grid" class="grid">
            </div>

        <div class="operators">
            <button class="op-btn" onclick="selectOp('+')">+</button>
            <button class="op-btn" onclick="selectOp('-')">-</button>
            <button class="op-btn" onclick="selectOp('*')">×</button>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="initGame()">Nowa Gra</button>
            <button class="action-btn" onclick="resetLevel()">Resetuj</button>
        </div>
    </div>

    <div id="win-message">
        <h2 style="color: var(--neon-pink); font-size: 32px;">GENIUSZ!</h2>
        <p>Rozwiązałeś zagadkę!</p>
        <button class="action-btn" onclick="initGame()" style="background: var(--neon-pink); color: black; border: none; font-weight: bold;">KOLEJNY POZIOM</button>
    </div>

    <script>
        let target = 0;
        let numbers = [];
        let initialNumbers = [];
        let selectedNumIdx = null;
        let selectedOp = null;

        function initGame() {
            document.getElementById('win-message').style.display = 'none';
            // Generuj 5 losowych liczb 1-10
            initialNumbers = Array.from({length: 5}, () => Math.floor(Math.random() * 9) + 2);
            
            // Symuluj rozwiązanie, aby cel był osiągalny
            target = generateWinnableTarget([...initialNumbers]);
            document.getElementById('target-number').innerText = target;
            
            resetLevel();
        }

        function generateWinnableTarget(tempNums) {
            // Wykonaj 3 losowe operacje na puli liczb
            for(let i = 0; i < 3; i++) {
                if(tempNums.length < 2) break;
                const idx1 = Math.floor(Math.random() * tempNums.length);
                const n1 = tempNums.splice(idx1, 1)[0];
                const idx2 = Math.floor(Math.random() * tempNums.length);
                const n2 = tempNums.splice(idx2, 1)[0];
                
                const ops = ['+', '-', '*'];
                const op = ops[Math.floor(Math.random() * ops.length)];
                
                let res;
                if(op === '+') res = n1 + n2;
                if(op === '-') res = Math.abs(n1 - n2);
                if(op === '*') res = n1 * n2;
                
                tempNums.push(res);
            }
            return tempNums[Math.floor(Math.random() * tempNums.length)];
        }

        function resetLevel() {
            numbers = [...initialNumbers];
            selectedNumIdx = null;
            selectedOp = null;
            render();
        }

        function render() {
            const grid = document.getElementById('numbers-grid');
            grid.innerHTML = '';
            
            numbers.forEach((num, idx) => {
                const btn = document.createElement('button');
                btn.className = `num-btn ${selectedNumIdx === idx ? 'selected' : ''}`;
                btn.innerText = num;
                btn.onclick = () => selectNum(idx);
                grid.appendChild(btn);
            });

            // Podświetl operatory
            document.querySelectorAll('.op-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.innerText === selectedOp || (btn.innerText === '×' && selectedOp === '*'));
            });

            // Sprawdź wygraną
            if (numbers.includes(target)) {
                document.getElementById('win-message').style.display = 'block';
            }
        }

        function selectNum(idx) {
            if (selectedNumIdx === null) {
                selectedNumIdx = idx;
            } else if (selectedNumIdx === idx) {
                selectedNumIdx = null; // odznacz
            } else if (selectedOp) {
                // Wykonaj działanie
                const n1 = numbers[selectedNumIdx];
                const n2 = numbers[idx];
                let res;

                if (selectedOp === '+') res = n1 + n2;
                if (selectedOp === '-') res = n1 - n2;
                if (selectedOp === '*') res = n1 * n2;

                // Aktualizuj tablicę (usuń stare, dodaj nowe)
                const newNumbers = numbers.filter((_, i) => i !== selectedNumIdx && i !== idx);
                newNumbers.push(res);
                numbers = newNumbers;
                
                selectedNumIdx = null;
                selectedOp = null;
            } else {
                // Zmień zaznaczoną liczbę
                selectedNumIdx = idx;
            }
            render();
        }

        function selectOp(op) {
            if (selectedNumIdx !== null) {
                selectedOp = op;
                render();
            }
        }

        // Start gry przy załadowaniu
        initGame();
    </script>
</body>
</html>
