<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Gier | Biblioteka</title>
    <link rel="icon" type="image/png" href="gamecon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Konfiguracja tła ze zdjęcia */
            background-color: #fce7f3; /* Zapasowy kolor: jasny róż, gdyby zdjęcie się nie wczytało */
            background-image: url('zdjecietla.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }

        /* Delikatna półprzezroczysta nakładka na całą stronę, aby tekst był zawsze czytelny, niezależnie od kolorów na zdjęciu */
        .bg-overlay {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(253, 242, 248, 0.75) 0%, rgba(255, 255, 255, 0.4) 100%);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            position: relative; /* Dodane dla prawidłowego pozycjonowania przycisku Powrót */
        }

        /* Estetyczne karty z efektem szkła (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px -5px rgba(236, 72, 153, 0.15); /* Delikatny różowy cień */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Płynna, sprężysta animacja najechania myszką */
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -5px rgba(236, 72, 153, 0.25);
            background: rgba(255, 255, 255, 0.85);
        }
        
        /* Animacja wejścia elementów na stronę */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div class="bg-overlay flex flex-col py-12 px-6 sm:px-12">
        
        <a href="https://obidobi.pl" class="absolute top-4 left-4 sm:top-8 sm:left-8 flex items-center text-slate-700 hover:text-pink-600 bg-white/50 hover:bg-white/80 backdrop-blur-md border border-white/50 px-4 py-2 rounded-full font-bold transition-all duration-300 shadow-sm hover:shadow-md z-50 group fade-in">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Powrót
        </a>

        <div class="max-w-6xl mx-auto w-full fade-in pt-10 sm:pt-0"> <header class="text-center mb-16">
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-400 drop-shadow-sm mb-4 tracking-tight">
                    Biblioteka Gier
                </h1>
                <p class="text-lg md:text-xl text-slate-700 font-semibold max-w-2xl mx-auto">
                    Więcej update'ów kiedyś tam...
                </p>
            </header>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">
                
                <a href="https://obidobi.pl/games/impostor" class="glass-card rounded-[2rem] overflow-hidden group flex flex-col cursor-pointer decoration-none">
                    
                    <div class="aspect-video relative overflow-hidden bg-pink-50">
                        
                        <div class="absolute inset-0 bg-gradient-to-br from-pink-300 via-pink-400 to-rose-400 group-hover:scale-105 transition-transform duration-500 z-0 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-white opacity-90 drop-shadow-md" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>

                        <img src="impostor_min.png" 
                             alt="Impostor - Miniaturka"
                             class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-in-out z-10"
                             onerror="this.style.display='none'">
                    </div>

                    <div class="p-6 md:p-8 flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex flex-wrap gap-2 mb-4">
                                <span class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-wider text-pink-600 bg-pink-100 rounded-full">
                                    Multiplayer
                                </span>
                                <span class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-wider text-purple-600 bg-purple-100 rounded-full">
                                    3+ graczy
                                </span>
                            </div>
                            
                            <h3 class="text-2xl font-bold text-slate-800 mb-3 group-hover:text-pink-500 transition-colors duration-300">
                                Impostor
                            </h3>
                            
                            <p class="text-slate-600 mb-6 line-clamp-3 leading-relaxed">
                                Każdy z uczestników losuje hasło, lecz niektórzy zamiast hasła dostają tylko podpowiedź i muszą hasło odgadnąć.
                            </p>
                        </div>
                        
                        <div class="flex items-center text-pink-500 font-bold text-sm uppercase tracking-widest mt-auto">
                            <span class="relative">
                                Graj teraz
                                <span class="absolute -bottom-1 left-0 w-0 h-[2px] bg-pink-500 transition-all duration-300 group-hover:w-full"></span>
                            </span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2 group-hover:translate-x-2 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </div>
                    </div>
                </a>
                
            </div>
        </div>
    </div>

</body>
</html>
