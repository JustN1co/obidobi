<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impostor</title>
<link rel="icon" type="image/png" href="/gamecon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #000000;
    --lime: #32CD32;
    --lime-dark: #28a428;
    --lime-glow: rgba(50,205,50,0.18);
    --surface: #0d0d0d;
    --surface2: #141414;
    --border: rgba(50,205,50,0.2);
    --text: #f0f0f0;
    --muted: #666;
    --red: #ff4444;
    --blue: #4dabf7;
    --radius: 18px;
    --radius-sm: 10px;
    --font: 'Montserrat', sans-serif;
  }

  html, body {
    background: var(--black);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background subtle grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(50,205,50,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(50,205,50,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* Back button */
  #back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 100;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--lime);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 50px;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #back-btn:hover { background: var(--lime-glow); border-color: var(--lime); transform: translateY(-1px); }
  #back-btn::before { content: '←'; font-size: 15px; }

  /* SCREENS */
  .screen {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 100px 20px 40px;
    animation: fadeIn 0.35s ease;
  }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* LOGO / TITLE */
  .logo {
    font-size: clamp(42px, 10vw, 72px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--lime);
    text-shadow: 0 0 40px rgba(50,205,50,0.35);
    margin-bottom: 6px;
    line-height: 1;
  }
  .logo-sub {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 44px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 20px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 18px;
  }

  /* INPUTS */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  input[type="text"], input[type="number"], select {
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    border-color: var(--lime);
  }
  input[type="number"] { width: 90px; flex-shrink: 0; }
  select { cursor: pointer; }
  select option { background: #111; }

  /* PLAYERS LIST */
  #players-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
    max-height: 260px;
    overflow-y: auto;
    padding-right: 4px;
  }
  #players-list::-webkit-scrollbar { width: 4px; }
  #players-list::-webkit-scrollbar-track { background: transparent; }
  #players-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .player-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .player-name { font-size: 15px; font-weight: 600; }
  .player-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--lime);
    background: var(--lime-glow);
    border-radius: 50px;
    padding: 2px 9px;
    margin-right: 10px;
  }
  .player-left { display: flex; align-items: center; }
  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 6px;
    transition: color 0.15s;
  }
  .remove-btn:hover { color: var(--red); }

  /* IMPOSTOR COUNT */
  .impostor-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    margin-top: 6px;
  }
  .impostor-label { font-size: 14px; font-weight: 600; }
  .counter-controls { display: flex; align-items: center; gap: 14px; }
  .counter-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--lime);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    line-height: 1;
    padding-bottom: 1px;
  }
  .counter-btn:hover { background: var(--lime-glow); transform: scale(1.1); }
  .counter-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  #impostor-count-display {
    font-size: 22px;
    font-weight: 900;
    color: var(--lime);
    min-width: 28px;
    text-align: center;
  }

  /* BUTTONS */
  .btn {
    width: 100%;
    max-width: 520px;
    padding: 16px;
    border-radius: var(--radius);
    border: none;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: var(--lime);
    color: #000;
    box-shadow: 0 0 0 0 var(--lime-glow);
  }
  .btn-primary:hover {
    opacity: 0.88;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(50,205,50,0.25);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-outline {
    background: transparent;
    color: var(--lime);
    border: 1px solid var(--lime);
  }
  .btn-outline:hover { background: var(--lime-glow); transform: translateY(-2px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

  /* ERROR */
  .error-msg {
    font-size: 13px;
    color: var(--red);
    font-weight: 600;
    text-align: center;
    min-height: 20px;
    margin: -8px 0 10px;
  }

  /* ─── PLAYER SCREEN ─── */
  #player-screen {
    text-align: center;
  }
  .turn-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .player-big-name {
    font-size: clamp(32px, 8vw, 56px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 40px;
    line-height: 1.1;
  }

  .reveal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .role-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .role-label.civilian { color: var(--blue); }
  .role-label.impostor { color: var(--red); }

  .role-icon {
    font-size: 52px;
    margin-bottom: 14px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .role-word {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }
  .role-word.civilian { color: var(--blue); }
  .role-word.impostor { color: var(--red); }

  .haslo-display {
    font-size: 30px;
    font-weight: 900;
    color: var(--lime);
    text-shadow: 0 0 30px var(--lime-glow);
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.2;
    animation: fadeIn 0.3s ease;
  }

  .hint-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .hidden-placeholder {
    font-size: 32px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .btn-reveal {
    background: var(--lime);
    color: #000;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius);
    padding: 15px 30px;
    cursor: pointer;
    width: 100%;
    max-width: 420px;
    margin-bottom: 12px;
    transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .btn-reveal:hover {
    opacity: 0.88;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(50,205,50,0.25);
  }
  .btn-reveal:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .btn-continue {
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    padding: 14px 30px;
    cursor: pointer;
    width: 100%;
    max-width: 420px;
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
  }
  .btn-continue:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.3); transform: translateY(-1px); }
  .btn-continue:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  /* ─── END SCREEN ─── */
  #end-screen { text-align: center; }

  .end-title {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 900;
    color: var(--lime);
    text-shadow: 0 0 40px rgba(50,205,50,0.4);
    letter-spacing: -0.01em;
    margin-bottom: 12px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .end-sub {
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 52px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 36px;
  }
  .summary-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
  }
  .summary-box-num {
    font-size: 34px;
    font-weight: 900;
    color: var(--lime);
    line-height: 1;
    margin-bottom: 6px;
  }
  .summary-box-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* DIVIDER */
  .divider {
    width: 100%;
    max-width: 520px;
    height: 1px;
    background: var(--border);
    margin: 8px 0 20px;
  }

  /* RESPONSIVE */
  @media (max-width: 480px) {
    .card { padding: 22px 18px; }
    .screen { padding: 90px 14px 40px; }
  }
</style>
</head>
<body>

<a id="back-btn" href="https://obidobi.pl/games">Powrót</a>

<!-- ═══ START SCREEN ═══ -->
<div id="start-screen" class="screen active">
  <div class="logo">IMPOSTOR</div>
  <div class="logo-sub">Gra towarzyska</div>

  <div class="card">
    <div class="card-title">Dodaj graczy</div>
    <div class="input-row">
      <input type="text" id="name-input" placeholder="Imię gracza..." maxlength="24" autocomplete="off" />
      <button class="btn btn-outline" style="width:auto;padding:12px 20px;max-width:none;" onclick="addPlayer()">+ Dodaj</button>
    </div>
    <div id="players-list"></div>
    <div id="no-players" style="text-align:center;color:var(--muted);font-size:13px;padding:20px 0;">
      Dodaj co najmniej 3 graczy
    </div>
  </div>

  <div class="card" style="margin-bottom:12px;">
    <div class="card-title">Liczba Impostorów</div>
    <div class="impostor-row">
      <span class="impostor-label">Impostorzy</span>
      <div class="counter-controls">
        <button class="counter-btn" id="dec-btn" onclick="changeImpostors(-1)" disabled>−</button>
        <span id="impostor-count-display">1</span>
        <button class="counter-btn" id="inc-btn" onclick="changeImpostors(1)">+</button>
      </div>
    </div>
  </div>

  <div class="error-msg" id="start-error"></div>
  <button class="btn btn-primary" onclick="startGame()">Rozpocznij Grę →</button>
</div>

<!-- ═══ PLAYER SCREEN ═══ -->
<div id="player-screen" class="screen">
  <div class="turn-badge" id="turn-badge">Gracz 1 z 6</div>
  <div class="player-big-name" id="current-player-name">Anna</div>

  <div class="reveal-card" id="reveal-card">
    <div class="hidden-placeholder">● ● ●</div>
  </div>

  <button class="btn-reveal" id="reveal-btn" onclick="revealRole()">Odkryj Hasło</button>
  <button class="btn-continue" id="continue-btn" onclick="nextPlayer()" disabled>Kontynuuj →</button>
</div>

<!-- ═══ END SCREEN ═══ -->
<div id="end-screen" class="screen">
  <div class="end-title">Gra się zaczęła!</div>
  <div class="end-sub">Wszyscy znają swoje role</div>

  <div class="summary-grid">
    <div class="summary-box">
      <div class="summary-box-num" id="sum-players">0</div>
      <div class="summary-box-label">Graczy</div>
    </div>
    <div class="summary-box">
      <div class="summary-box-num" id="sum-impostors">0</div>
      <div class="summary-box-label">Impostorów</div>
    </div>
  </div>

  <button class="btn btn-primary" style="margin-bottom:12px;" onclick="newRound()">Nowa Runda →</button>
  <button class="btn btn-outline" onclick="goToSetup()">Zmień Graczy</button>
</div>

    { haslo: "Chmura",    podpowiedz: "Wata cukrowa" },
    { haslo: "Parasol",   podpowiedz: "Burza" },
    { haslo: "Wiatr",     podpowiedz: "Jesień" },
  ];
  let players = [];
  let impostorCount = 1;
  let assignedRoles = [];
  let currentIndex = 0;
  let revealed = false;
  let currentPair = null;

  /* ─── PLAYER MANAGEMENT ─── */
  function addPlayer() {
    const inp = document.getElementById('name-input');
    const name = inp.value.trim();
    if (!name) return;
    if (players.includes(name)) {
      showError('start-error', 'Ten gracz już jest na liście!');
      return;
    }
    players.push(name);
    inp.value = '';
    inp.focus();
    renderPlayers();
    validateImpostorCount();
    clearError('start-error');
  }

  document.getElementById('name-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addPlayer();
  });

  function removePlayer(idx) {
    players.splice(idx, 1);
    renderPlayers();
    validateImpostorCount();
  }

  function renderPlayers() {
    const list = document.getElementById('players-list');
    const noPlayers = document.getElementById('no-players');
    if (players.length === 0) {
      list.innerHTML = '';
      noPlayers.style.display = 'block';
      return;
    }
    noPlayers.style.display = 'none';
    list.innerHTML = players.map((p, i) => `
      <div class="player-item">
        <div class="player-left">
          <span class="player-num">${i + 1}</span>
          <span class="player-name">${escHtml(p)}</span>
        </div>
        <button class="remove-btn" onclick="removePlayer(${i})" title="Usuń">×</button>
      </div>
    `).join('');
  }

  /* ─── IMPOSTOR COUNTER ─── */
  function changeImpostors(delta) {
    const max = Math.max(1, players.length - 1);
    impostorCount = Math.min(max, Math.max(1, impostorCount + delta));
    document.getElementById('impostor-count-display').textContent = impostorCount;
    document.getElementById('dec-btn').disabled = impostorCount <= 1;
    document.getElementById('inc-btn').disabled = impostorCount >= max;
  }

  function validateImpostorCount() {
    const max = Math.max(1, players.length - 1);
    if (impostorCount > max) impostorCount = max;
    if (impostorCount < 1) impostorCount = 1;
    document.getElementById('impostor-count-display').textContent = impostorCount;
    document.getElementById('dec-btn').disabled = impostorCount <= 1;
    document.getElementById('inc-btn').disabled = impostorCount >= max || players.length < 2;
  }

  /* ─── START GAME ─── */
  function startGame() {
    clearError('start-error');
    if (players.length < 2) {
      showError('start-error', 'Dodaj co najmniej 2 graczy!');
      return;
    }
    if (impostorCount >= players.length) {
      showError('start-error', 'Impostorów nie może być więcej niż graczy!');
      return;
    }
    currentPair = PASSWORDS[Math.floor(Math.random() * PASSWORDS.length)];
    assignedRoles = assignRoles(players.length, impostorCount);
    currentIndex = 0;
    showScreen('player-screen');
    loadPlayer();
  }

  function assignRoles(total, numImpostors) {
    const roles = Array(total).fill('civilian');
    let placed = 0;
    while (placed < numImpostors) {
      const idx = Math.floor(Math.random() * total);
      if (roles[idx] === 'civilian') {
        roles[idx] = 'impostor';
        placed++;
      }
    }
    return roles;
  }

  /* ─── PLAYER SCREEN ─── */
  function loadPlayer() {
    revealed = false;
    const name = players[currentIndex];
    document.getElementById('turn-badge').textContent = `Gracz ${currentIndex + 1} z ${players.length}`;
    document.getElementById('current-player-name').textContent = name;

    const card = document.getElementById('reveal-card');
    card.innerHTML = `<div class="hidden-placeholder">● ● ●</div>`;

    document.getElementById('reveal-btn').disabled = false;
    document.getElementById('continue-btn').disabled = true;
  }

  function revealRole() {
    if (revealed) return;
    revealed = true;
    const role = assignedRoles[currentIndex];
    const card = document.getElementById('reveal-card');
    document.getElementById('reveal-btn').disabled = true;
    document.getElementById('continue-btn').disabled = false;

    if (role === 'civilian') {
      card.innerHTML = `
        <div class="role-label civilian">Twoja rola</div>
        <div class="role-icon">🔵</div>
        <div class="role-word civilian">CYWIL</div>
        <div class="haslo-display">${escHtml(currentPair.haslo)}</div>
      `;
    } else {
      card.innerHTML = `
        <div class="role-label impostor">Twoja rola</div>
        <div class="role-icon">🔴</div>
        <div class="role-word impostor">IMPOSTOR</div>
        <div class="hint-label">Twoja podpowiedź</div>
        <div class="haslo-display" style="color:var(--red);text-shadow:0 0 30px rgba(255,68,68,0.3);">${escHtml(currentPair.podpowiedz)}</div>
      `;
    }
  }

  function nextPlayer() {
    currentIndex++;
    if (currentIndex >= players.length) {
      showEndScreen();
    } else {
      loadPlayer();
    }
  }

  /* ─── END SCREEN ─── */
  function showEndScreen() {
    document.getElementById('sum-players').textContent = players.length;
    document.getElementById('sum-impostors').textContent = impostorCount;
    showScreen('end-screen');
  }

  function newRound() {
    currentPair = PASSWORDS[Math.floor(Math.random() * PASSWORDS.length)];
    assignedRoles = assignRoles(players.length, impostorCount);
    currentIndex = 0;
    showScreen('player-screen');
    loadPlayer();
  }

  function goToSetup() {
    showScreen('start-screen');
  }

  /* ─── UTILS ─── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0, 0);
  }
  function showError(id, msg) {
    document.getElementById(id).textContent = msg;
  }
  function clearError(id) {
    document.getElementById(id).textContent = '';
  }
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
