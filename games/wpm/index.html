<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Typing Warrior</title>
    <link rel="icon" type="image/png" href="/gamecon.png">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root {
            --pink: #ff007f;
            --black: #000000;
        }

        body {
            margin: 0; padding: 0;
            background: url('wpm_bg.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            color: white;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        #game-container {
            width: 900px; height: 650px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid var(--pink);
            box-shadow: 0 0 30px var(--pink);
            position: relative;
            display: flex; flex-direction: column;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10;
        }
        .active { display: flex; }

        h1, h2, h3 { color: var(--pink); text-align: center; text-transform: uppercase; }

        button {
            background: transparent; border: 2px solid var(--pink); color: var(--pink);
            padding: 12px 24px; margin: 10px; cursor: pointer; font-size: 18px;
            font-weight: bold; font-family: 'Courier New', Courier, monospace;
            transition: 0.2s;
        }
        button:hover { background: var(--pink); color: var(--black); box-shadow: 0 0 15px var(--pink); }

        .level-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; 
            margin: 15px 0; /* Zmniejszono odstępy by zacieśnić UI */
        }

        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5; display: none;
        }
        .top-bar {
            display: flex; justify-content: flex-end; padding: 15px 25px;
            pointer-events: auto;
        }
        .bottom-bar {
            position: absolute; bottom: 70px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 40px;
            font-size: 22px; font-weight: bold; color: var(--pink);
        }
        
        #timer { font-size: 28px; font-weight: bold; color: var(--pink); }

        #game-canvas { display: block; width: 100%; height: calc(100% - 60px); }

        #word-input {
            width: 100%; height: 60px; background: #111; color: var(--pink);
            border: none; border-top: 2px solid var(--pink); text-align: center;
            font-size: 28px; font-family: 'Courier New', Courier, monospace;
            outline: none; position: absolute; bottom: 0;
        }

        #records-container {
            width: 80%; max-height: 400px; overflow-y: auto; text-align: left;
            border: 1px solid var(--pink); padding: 15px; margin-top: 10px;
        }
        .record-entry {
            display: flex; justify-content: space-between;
            border-bottom: 1px dashed #333; padding: 5px 0; font-size: 18px;
        }
        .record-entry span:nth-child(2) { color: var(--pink); font-weight: bold; }
        
        /* ZAKTUALIZOWANY STYL LOGO I MENU */
        #menu-logo { 
            margin-top: -100px; /* Przesunięcie mocno w górę */
            margin-bottom: -30px; /* Ujemny margines pozwala UI wejść pod/na logo */
            max-width: 56%; 
            height: auto; 
            position: relative;
            z-index: 1; /* Logo warstwę niżej */
        }

        /* Gwarantuje, że przyciski są zawsze klikalne, nawet jak nachodzą na przezroczyste logo */
        #screen-menu button, #screen-menu .level-grid {
            position: relative;
            z-index: 2; 
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="game-ui">
        <div class="top-bar"><div id="timer">00:30</div></div>
        <div class="bottom-bar">
            <div>Wynik: <span id="score-val">0</span></div>
            <div>WPM: <span id="wpm-val">0</span></div>
        </div>
    </div>

    <div id="screen-menu" class="screen active" style="background: rgba(0,0,0,0.9);">
        <img id="menu-logo" src="main1.png" alt="Typing Warrior">
        <button onclick="window.location.href='https://obidobi.pl/games'">Powrót do portalu</button>
        <div class="level-grid" id="level-buttons"></div>
        <!-- TUTAJ ZMIANA: Dodano style="margin-top: 40px;" aby obniżyć przycisk -->
        <button onclick="showScreen('records')" style="margin-top: 40px;">🏆 Rekordy Świata</button>
    </div>

    <div id="screen-game" class="screen">
        <canvas id="game-canvas" width="900" height="590"></canvas>
        <input type="text" id="word-input" autocomplete="off" spellcheck="false" placeholder="pisz tutaj...">
    </div>

    <div id="screen-summary" class="screen" style="background: rgba(0,0,0,0.95);">
        <h2>Koniec Poziomu <span id="sum-level"></span>!</h2>
        <div style="font-size: 22px; line-height: 2; margin: 20px 0; text-align: center;">
            <p>Słowa na minutę (WPM): <span id="sum-wpm" style="color: var(--pink);">0</span></p>
            <p>Celność: <span id="sum-acc" style="color: var(--pink);">0</span>%</p>
            <hr style="border-color: #333;">
            <h3 style="font-size: 32px;">Wynik Całościowy: <span id="sum-score" style="color: white;">0</span></h3>
        </div>
        <div id="highscore-msg" style="color: yellow; font-weight: bold; margin-bottom: 10px;"></div>
        <button onclick="backToMenu()">Wróć do listy leveli</button>
    </div>

    <div id="screen-records" class="screen" style="background: rgba(0,0,0,0.95);">
        <h2>Rekordy Świata</h2>
        <p style="color: #aaa; font-size: 14px;">Obliczane na podstawie: WPM * Accuracy%</p>
        <div style="margin-bottom: 10px;">
            <label>Wybierz poziom: </label>
            <select id="record-level-select" onchange="loadRecords()" style="background: black; color: var(--pink); border: 1px solid var(--pink); padding: 5px;">
                <option value="1">Level 1</option><option value="2">Level 2</option>
                <option value="3">Level 3</option><option value="4">Level 4</option>
                <option value="5">Level 5</option><option value="6">Level 6</option>
                <option value="7">Level 7</option><option value="8">Level 8</option>
                <option value="9">Level 9</option><option value="10">Level 10</option>
            </select>
        </div>
        <div id="records-container">Ładowanie wyników...</div>
        <button onclick="backToMenu()" style="margin-top: 20px;">Powrót</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBF8W9CkrbEIG1GkgG5v54ut_CGFm0x9dw",
        authDomain: "typer-63c85.firebaseapp.com",
        databaseURL: "https://typer-63c85-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "typer-63c85",
        storageBucket: "typer-63c85.firebasestorage.app",
        messagingSenderId: "820535906139",
        appId: "1:820535906139:web:def56f6a0ed2039fe4147e",
        measurementId: "G-BDMC0YGQX2"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const englishWords = ["apple", "river", "mountain", "window", "chair", "planet", "guitar", "ocean", "butterfly", "music", "forest", "bridge", "clock", "camera", "train", "ticket", "mirror", "garden", "cloud", "stone", "water", "storm", "coffee", "pizza", "orange", "yellow", "purple", "animal", "tiger", "lion", "elephant", "monkey", "spider", "snake", "eagle", "bread", "cheese", "butter", "knife", "spoon", "fork", "plate", "bottle", "glass", "paper", "pencil", "eraser", "school", "house", "street", "car", "bicycle", "plane", "boat", "ship", "shoe", "shirt", "pants", "hat", "glove", "winter", "summer", "spring", "autumn", "snow", "rain", "wind", "fire", "earth", "moon", "star", "space", "alien", "robot", "human", "friend", "family", "child", "doctor", "police", "money", "wallet", "bank", "store", "market", "city", "village", "country", "world", "history", "future", "present", "morning", "night", "evening", "today", "tomorrow", "yesterday", "week", "month", "year", "book", "story", "letter", "word", "number", "color", "shape", "circle", "square", "triangle", "heart", "smile", "laugh", "cry", "sleep", "dream", "wake", "walk", "run", "jump", "swim", "fly", "drive", "ride", "play", "game", "sport", "ball", "team", "player", "winner", "loser", "score", "goal", "point", "match", "race", "track", "field", "computer", "keyboard", "mouse", "laptop", "screen", "battery", "phone", "internet", "website", "software", "message", "email", "video", "audio", "network", "server", "data", "password", "button", "teacher", "student", "engineer", "nurse", "artist", "chef", "pilot", "lawyer", "farmer", "soldier", "writer", "actor", "door", "roof", "floor", "wall", "stairs", "bedroom", "kitchen", "bathroom", "fridge", "oven", "lamp", "desk", "shelf", "towel", "soap", "brush", "blanket", "pillow", "key", "curtain", "desert", "island", "volcano", "valley", "canyon", "jungle", "cave", "beach", "sand", "shell", "flower", "leaf", "tree", "grass", "thunder", "lightning", "fog", "frost", "sunrise", "sunset", "head", "face", "eye", "ear", "nose", "mouth", "tooth", "hair", "hand", "finger", "arm", "leg", "foot", "blood", "brain", "bone", "skin", "muscle", "health", "breakfast", "lunch", "dinner", "sugar", "salt", "pepper", "honey", "milk", "juice", "tea", "soup", "salad", "meat", "fish", "fruit", "vegetable", "cake", "cookie", "chocolate", "ice", "happy", "sad", "angry", "brave", "smart", "kind", "funny", "strong", "weak", "fast", "slow", "heavy", "light", "hard", "soft", "loud", "quiet", "beautiful", "ugly", "clean", "dirty", "moment", "second", "minute", "hour", "century", "peace", "war", "truth", "lie", "freedom", "justice", "power", "energy", "shadow", "sound", "silence", "idea", "thought", "memory"];
    
    let currentLevel = 1, score = 0, wordsTyped = 0, totalKeysPressed = 0, correctKeysPressed = 0, timeLeft = 30;
    let activeWords = [], gameInterval, timerInterval, animationFrameId;

    const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d'), input = document.getElementById('word-input');

    const wordBellSound = new Audio('word_bell.mp3');
    wordBellSound.volume = 0.5;

    const menuLogo = document.getElementById('menu-logo');
    let isMain1 = true;
    setInterval(() => {
        if(menuLogo) {
            isMain1 = !isMain1;
            menuLogo.src = isMain1 ? 'main1.png' : 'main2.png';
        }
    }, 400);

    const levelContainer = document.getElementById('level-buttons');
    for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button'); btn.innerText = `LEVEL ${i}`;
        btn.onclick = () => startLevel(i); levelContainer.appendChild(btn);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(`screen-${screenId}`).classList.add('active');
        if(screenId === 'records') loadRecords();
    }

    function backToMenu() {
        clearInterval(gameInterval); clearInterval(timerInterval); cancelAnimationFrame(animationFrameId);
        activeWords = []; input.value = ''; document.getElementById('game-ui').style.display = 'none';
        showScreen('menu');
    }

    function startLevel(level) {
        clearInterval(gameInterval); clearInterval(timerInterval); cancelAnimationFrame(animationFrameId);
        currentLevel = level; score = 0; wordsTyped = 0; totalKeysPressed = 0; correctKeysPressed = 0; timeLeft = 30; activeWords = [];
        document.getElementById('score-val').innerText = '0'; document.getElementById('wpm-val').innerText = '0';
        document.getElementById('timer').innerText = '00:30'; document.getElementById('highscore-msg').innerText = '';
        input.value = ''; document.getElementById('game-ui').style.display = 'block';
        showScreen('game'); setTimeout(() => input.focus(), 100);

        const baseFallSpeed = 0.5 + (level * 0.1), spawnRate = Math.max(700, 2000 - (level * 120));

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
            let elapsedMin = (30 - timeLeft) / 60;
            document.getElementById('wpm-val').innerText = elapsedMin > 0 ? Math.round(wordsTyped / elapsedMin) : 0;
            if (timeLeft <= 0) endLevel();
        }, 1000);

        gameInterval = setInterval(() => {
            activeWords.push({
                text: englishWords[Math.floor(Math.random() * englishWords.length)],
                x: Math.random() * (canvas.width - 150) + 20, y: -20,
                speed: baseFallSpeed + (Math.random() * 0.3)
            });
        }, spawnRate);
        gameLoop();
    }

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 22px Courier New'; ctx.fillStyle = '#ff007f';
        activeWords.forEach((w, i) => {
            w.y += w.speed; ctx.shadowBlur = 10; ctx.shadowColor = "#ff007f";
            ctx.fillText(w.text, w.x, w.y); ctx.shadowBlur = 0;
            if (w.y > canvas.height) activeWords.splice(i, 1);
        });
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    input.addEventListener('input', () => {
        totalKeysPressed++;
        const typedText = input.value.trim().toLowerCase();
        const matchIndex = activeWords.findIndex(w => w.text === typedText);
        if (matchIndex !== -1) {
            wordBellSound.currentTime = 0;
            wordBellSound.play().catch(e => console.log('Odtwarzanie dźwięku zablokowane przez przeglądarkę:', e));

            correctKeysPressed += typedText.length; wordsTyped++;
            score += typedText.length * 10; document.getElementById('score-val').innerText = score;
            activeWords.splice(matchIndex, 1); input.value = '';
        }
    });

    async function endLevel() {
        clearInterval(gameInterval); clearInterval(timerInterval); cancelAnimationFrame(animationFrameId);
        document.getElementById('game-ui').style.display = 'none';

        let finalWpm = Math.round(wordsTyped / 0.5);
        let acc = totalKeysPressed > 0 ? Math.round((correctKeysPressed / totalKeysPressed) * 100) : 0;
        let finalScore = Math.round(finalWpm * (Math.min(acc, 100) / 100));

        document.getElementById('sum-level').innerText = currentLevel;
        document.getElementById('sum-wpm').innerText = finalWpm;
        document.getElementById('sum-acc').innerText = Math.min(acc, 100);
        document.getElementById('sum-score').innerText = finalScore;

        showScreen('summary');
        if (finalScore > 0) checkLeaderboard(finalScore);
    }

    function checkLeaderboard(playerScore) {
        const ref = db.ref(`leaderboard/level${currentLevel}`);
        
        ref.orderByChild('score').once('value', snapshot => {
            let data = snapshot.val();
            let isTop10 = false;
            let count = 0;
            let minScore = 999999;

            if (!data) {
                isTop10 = true;
            } else {
                let records = Object.values(data);
                count = records.length;
                minScore = Math.min(...records.map(r => r.score));

                if (count < 10 || playerScore > minScore) {
                    isTop10 = true;
                }
            }

            if (isTop10) {
                document.getElementById('highscore-msg').innerText = "NOWY REKORD TOP 10!";
                setTimeout(() => {
                    let nick = prompt(`Gratulacje! Wynik ${playerScore} kwalifikuje się do TOP 10!\nPodaj swój nick:`);
                    if (nick && nick.trim().length > 0) {
                        ref.push({ name: nick.trim(), score: playerScore });
                        
                        if (count >= 10) {
                            ref.orderByChild('score').limitToFirst(1).once('value', snap => {
                                snap.forEach(child => child.ref.remove());
                            });
                        }
                        alert("Wynik zapisany!");
                    }
                }, 700);
            }
        });
    }

    function loadRecords() {
        const lvl = document.getElementById('record-level-select').value;
        const container = document.getElementById('records-container');
        container.innerHTML = "Ładowanie...";
        db.ref(`leaderboard/level${lvl}`).orderByChild('score').once('value', snapshot => {
            const data = snapshot.val(); container.innerHTML = '';
            if (!data) { container.innerHTML = "<div style='text-align:center;'>Brak rekordów.</div>"; return; }
            Object.values(data).sort((a, b) => b.score - a.score).forEach((entry, i) => {
                const div = document.createElement('div'); div.className = 'record-entry';
                div.innerHTML = `<span>${i + 1}. ${entry.name}</span> <span>${entry.score} pkt</span>`;
                container.appendChild(div);
            });
        });
    }
</script>
</body>
</html>
